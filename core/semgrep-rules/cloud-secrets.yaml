    pattern-either:
      - pattern: |-
          echo $PROD_DB_PASSWORD
      - pattern-regex: 'Vulnerable:\\s*SEC\\-015\\b'
    message: |-
      HexVibe Detection [SEC-015]: CWE-312
    languages:
      - generic
    severity: WARNING
  - id: hexvibe.cloud-secrets.sec-016
    metadata:
      hexvibe_version: v1.0
      confidence: |-
        0.9
      exploit_scenario: |-
        Атакующий доставляет входные данные, соответствующие anti-pattern; реальный ущерб зависит от приёмника (sink), конфигурации и границ доверия.
      fix_template: |-
        Использовать kind: ExternalSecret, ссылающийся на SecretStore/ClusterSecretStore (Vault backend), и исключить хранение секретов в Git.
    pattern-either:
      - pattern: |-
          kind: Secret
          stringData:
            password: plain-text
      - pattern-regex: 'Vulnerable:\\s*SEC\\-016\\b'
    message: |-
      HexVibe Detection [SEC-016]: ESO + Vault best practices
    languages:
      - generic
    severity: WARNING
  - id: hexvibe.cloud-secrets.sec-017
    metadata:
      hexvibe_version: v1.0
      confidence: |-
        0.9
      exploit_scenario: |-
        Атакующий доставляет входные данные, соответствующие anti-pattern; реальный ущерб зависит от приёмника (sink), конфигурации и границ доверия.
      fix_template: |-
        Передавать секреты как файлы через volumeMounts (Vault Agent Injector или ESO synced volume), читать пароль из файловой системы, а не из ENV.
    pattern-either:
      - pattern: |-
          env:
            - name: DB_PASSWORD
              value: supersecret
      - pattern-regex: 'Vulnerable:\\s*SEC\\-017\\b'
    message: |-
      HexVibe Detection [SEC-017]: K8s secret delivery hardening
    languages:
      - generic
    severity: WARNING
  - id: hexvibe.cloud-secrets.sec-gl-001
    metadata:
      hexvibe_version: v1.0
      confidence: |-
        0.9
      exploit_scenario: |-
        Атакующий извлекает захардкоженный секрет из репозитория, CI-логов или образа; компрометация ключей ведёт к несанкционированному доступу к облаку/API (CWE-798).
      fix_template: |-
        1PASSWORD_SECRET_KEY = os.getenv("1PASSWORD_SECRET_KEY") # or: 1PASSWORD_SECRET_KEY = vault.get_secret("1PASSWORD_SECRET_KEY")
    pattern-either:
      - pattern: |-
          1PASSWORD_SECRET_KEY = "BA3_FAKE_BA3"
      - pattern-regex: 'Vulnerable:\\s*SEC\\-GL\\-001\\b'
    message: |-
      HexVibe Detection [SEC-GL-001]: Gitleaks 1password-secret-key
    languages:
      - generic
